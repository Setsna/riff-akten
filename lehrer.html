<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Geschlossene Schulanwendung: nicht in Suchmaschinen. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2f45">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<title>Riff-Akten – Lehrerbereich</title>
<link rel="stylesheet" href="css/riff-akten.css?v=5">
<link rel="stylesheet" href="css/lehrer.css?v=5">
</head>
<body class="lehrerseite">
<div class="grund" aria-hidden="true"></div>
<div id="app"></div>
<div id="live" class="unsichtbar" aria-live="polite"></div>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-titel">
  <h2 id="dialog-titel"></h2>
  <p id="dialog-text"></p>
  <div class="dialog__knoepfe">
    <button type="button" class="lknopf leise" id="dialog-nein">Abbrechen</button>
    <button type="button" class="lknopf" id="dialog-ja">OK</button>
  </div>
</dialog>
<!-- Firebase (einzige erlaubte Fremdquelle) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/config.js?v=5"></script>
<script src="js/lehrer.js?v=5"></script>
</body>
</html>
