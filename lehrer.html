<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content Security Policy: Der Browser fuehrt nur Skripte aus den
     eigenen Dateien und von Firebase aus und spricht nur mit Firebase.
     Eingeschleuster Code (Inline-Skripte, Ereignis-Attribute, fremde
     Adressen) wird blockiert. Neue fremde Adresse = hier eintragen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self' https://*.googleapis.com; frame-src https://lernplattform-44aa1.firebaseapp.com; base-uri 'none'; form-action 'self'; object-src 'none'">
<!-- Geschlossene Schulanwendung: nicht in Suchmaschinen. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0e2f45">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<title>Riff-Akten – Lehrerbereich</title>
<link rel="stylesheet" href="css/riff-akten.css?v=30">

</head>
<body class="lehrerseite">
<div class="grund" aria-hidden="true"></div>
<div id="app"></div>
<div id="live" class="unsichtbar" aria-live="polite"></div>
<dialog id="dialog" class="dialog" aria-labelledby="dialog-titel">

  <p id="dialog-text"></p>
  <div class="dialog__knoepfe">
    <button type="button" class="lknopf leise" id="dialog-nein">Abbrechen</button>

  </div>
</dialog>
