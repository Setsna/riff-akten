<!-- Content Security Policy: Der Browser fuehrt nur Skripte aus den
     eigenen Dateien und von Firebase aus und spricht nur mit Firebase.
     Eingeschleuster Code (Inline-Skripte, Ereignis-Attribute, fremde
     Adressen) wird blockiert. Neue fremde Adresse = hier eintragen. -->

<meta name="apple-mobile-web-app-capable" content="yes">

     Für jedes eigene Skript dieser Seite steht hier eine Zeile mit genau derselben Adresse, auch dieselbe Nummer ?v=N.
     Kommt ein Skript dazu oder fällt eines weg: hier mit ändern. Firebase steht absichtlich nicht hier. -->
