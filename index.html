<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content Security Policy: Der Browser fuehrt nur Skripte aus den
     eigenen Dateien und von Firebase aus und spricht nur mit Firebase.
     Eingeschleuster Code (Inline-Skripte, Ereignis-Attribute, fremde
     Adressen) wird blockiert. Neue fremde Adresse = hier eintragen. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self'; connect-src 'self' https://*.googleapis.com; base-uri 'none'; form-action 'self'; object-src 'none'">
<!-- Geschlossene Schulanwendung: nicht in Suchmaschinen. -->
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Riff-Akten">
<meta name="theme-color" content="#0e2f45">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preload" href="schriften/libre-caslon-text.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="schriften/andika-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<title>Riff-Akten</title>
<link rel="stylesheet" href="css/riff-akten.css?v=30">
</head>
<body>
<!-- Gemalter Riffgrund, Lichtschacht und Randblasen: nur Schmuck -->
<div class="grund" aria-hidden="true"></div>
<div class="licht" aria-hidden="true"></div>
<div class="blasen" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div id="speicherleiste" class="speicherleiste" role="status" hidden></div>
<div id="app"></div>
<div id="live" class="unsichtbar" aria-live="polite"></div>
<script src="js/config.js?v=30"></script>
<script src="js/konto-abgleich.js?v=30"></script>
<script src="js/konto-speicher.js?v=30"></script>
<script src="js/konto-cloud.js?v=30"></script>
<script src="js/merge.js?v=30"></script>
<script src="js/store.js?v=30"></script>
<script src="js/cloud.js?v=30"></script>
<script src="js/app.js?v=30"></script>
<script src="js/buch.js?v=30"></script>
<script src="js/akten.js?v=30"></script>
<!-- Firebase (einzige erlaubte Fremdquelle), hinter den eigenen Skripten: Die Seite
     wartet nicht darauf. Ohne Netz zeigt die App einen Hinweis. -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" integrity="sha384-Ke0FJhH7LyRqDxZ0wt+/OXV38yfQVu7g9VPEEGjYmB4RVOY/ta04uecRhsMwT7V3" crossorigin="anonymous"></script>
</body>
</html>
