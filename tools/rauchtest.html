<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Riff-Akten – Rauchtest</title>
<!--
  Rauchtest für die Kinder-App (index.html), Aufbau wie bei Perlentaucher.

  Starten:   powershell -ExecutionPolicy Bypass -File tools\server.ps1
  Öffnen:    http://localhost:8123/tools/rauchtest.html

  Die App läuft mit der Firebase-Attrappe (tools/test/firebase-attrappe.js).
  Nichts geht an die echte Datenbank. Geprüft wird das echte index.html
  mit allen echten Skripten; nur die drei Firebase-Skripte werden ersetzt.

  Ergebnis: Liste auf der Seite, Seitentitel beginnt mit OK oder FEHLER,
  window.RAUCHTEST hält { fertig, ok, fehler, liste }.
-->
<style>
  body { font: 15px/1.45 system-ui, sans-serif; margin: 16px; background: #F4F9FB; color: #13323B; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #stand { font-weight: 700; margin: 8px 0 12px; }
  #stand.ok { color: #1F7A3A; } #stand.fehler { color: #B3261E; }
  ol { padding-left: 22px; } li { margin: 3px 0; }
  li.fehler { color: #B3261E; }
  li small { color: #5A7680; display: block; }
  iframe { width: 390px; height: 700px; border: 1px solid #B9D3DC; border-radius: 8px; background: #fff; }
  .raster { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .raster > div { flex: 1 1 320px; min-width: 0; }
</style>
</head>
<body>
<h1>Riff-Akten – Rauchtest</h1>
<div id="stand">läuft …</div>
<div class="raster">
  <div><ol id="liste"></ol></div>
  <iframe id="app" title="App im Test"></iframe>
</div>
<script src="test/demo-fall.js"></script>
<script>
(function () {
  'use strict';

  var CODE = 'TEST2345';
  var MAIL = CODE.toLowerCase() + '@riff-akten.firebaseapp.com';
  var FREMD = 'ZZZZ9999';                       // gültiges Format, nicht freigeschaltet
  var rahmen = document.getElementById('app');
  var ergebnis = window.RAUCHTEST = { fertig: false, ok: 0, fehler: 0, liste: [] };
  var quelltext = null;

  // ---------- Hilfen ----------
  function warteAuf(beschreibung, f, ms) {
    var bis = Date.now() + (ms || 8000);
    return new Promise(function (ok, nein) {
      (function versuch() {
        var x; try { x = f(); } catch (e) { x = null; }
        if (x) return ok(x);
        if (Date.now() > bis) return nein(new Error('Zeit abgelaufen: ' + beschreibung));
        setTimeout(versuch, 40);
      })();
    });
  }
  function win() { return rahmen.contentWindow; }
  function doc() { return rahmen.contentDocument; }
  function q(sel) { return doc().querySelector(sel); }
  function qa(sel) { return Array.prototype.slice.call(doc().querySelectorAll(sel)); }
  function pruefe(bed, text) { if (!bed) throw new Error(text); }
  function text(sel) { var el = q(sel); return el ? el.textContent.trim() : ''; }

  function eintragen(name, ok, info) {
    var li = document.createElement('li');
    li.className = ok ? 'ok' : 'fehler';
    li.textContent = (ok ? 'OK  ' : 'FEHLER  ') + name;
    if (info) { var s = document.createElement('small'); s.textContent = info; li.appendChild(s); }
    document.getElementById('liste').appendChild(li);
    ergebnis.liste.push({ name: name, ok: ok, info: info || '' });
    if (ok) ergebnis.ok++; else ergebnis.fehler++;
  }

  function test(name, f) {
    return Promise.resolve().then(f).then(function (info) {
      var fe = (win() && win().FEHLER) || [];
      if (fe.length) throw new Error('Skriptfehler in der App: ' + fe.join(' | '));
      eintragen(name, true, info);
    }, function (e) {
      eintragen(name, false, e && e.message ? e.message : String(e));
    });
  }

  // Barrierefreiheit der gerade sichtbaren Ansicht (Grundregeln aus CLAUDE.md)
  function barrierefrei(ansicht) {
    var h1 = qa('h1');
    pruefe(h1.length === 1, ansicht + ': ' + h1.length + ' statt 1 h1');
    // Überschriften ohne Sprünge
    var stufe = 0;
    qa('h1,h2,h3,h4').forEach(function (h) {
      var n = +h.tagName[1];
      pruefe(n <= stufe + 1, ansicht + ': Überschrift springt auf ' + h.tagName);
      stufe = n;
    });
    // Eingabefelder mit label oder aria-label
    qa('input,select,textarea').forEach(function (el) {
      var hat = el.getAttribute('aria-label') || (el.id && q('label[for="' + el.id + '"]'));
      pruefe(hat, ansicht + ': Eingabefeld ohne Beschriftung');
    });
    // Nichts Klickbares außer button/a
    qa('[onclick],[data-action]').forEach(function (el) {
      pruefe(/^(BUTTON|A)$/.test(el.tagName), ansicht + ': klickbares ' + el.tagName);
    });
    // Knöpfe mit Text oder aria-label
    qa('button').forEach(function (b) {
      pruefe(b.textContent.trim() || b.getAttribute('aria-label'), ansicht + ': Knopf ohne Namen');
    });
    pruefe(q('[aria-live]'), ansicht + ': kein aria-live-Bereich');
    pruefe(qa('a[href="datenschutz.html"]').length && qa('a[href="impressum.html"]').length,
      ansicht + ': Links zu Datenschutz/Impressum fehlen');
  }

  // ---------- App laden ----------
  // opt.seite: 'index' (Kinder-App, Vorgabe) oder 'lehrer'
  function appLaden(opt) {
    opt = opt || {};
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    window.SZENARIO = { daten: opt.daten || {}, konten: opt.konten || {},
                        lehrer: opt.lehrer, googleKonto: opt.googleKonto };

    var lehrer = opt.seite === 'lehrer';
    var html = lehrer ? lehrerText : quelltext;
    var fb = /<script src="https:\/\/www\.gstatic\.com\/firebasejs\/[^"]+"><\/script>\s*/g;
    var treffer = html.match(fb) || [];
    if (treffer.length !== 3) {
      return Promise.reject(new Error('index.html bindet ' + treffer.length + ' statt 3 Firebase-Skripte ein.'));
    }
    var ersatz = opt.modus === 'offline' ? '' :
      '<script>window.ATTRAPPE = parent.SZENARIO;<\/script>' +
      '<script src="tools/test/firebase-attrappe.js"><\/script>\n';
    var n = 0;
    html = html.replace(fb, function () { return n++ === 0 ? ersatz : ''; });
    html = html.replace(/<head>/i, '<head><base href="/">' +
      '<script>window.FEHLER = [];' +
      'addEventListener("error", function (e) { FEHLER.push(e.message + " (" + (e.filename || "") + ":" + e.lineno + ")"); });' +
      'addEventListener("unhandledrejection", function (e) { FEHLER.push("Promise: " + (e.reason && e.reason.message || e.reason)); });' +
      '<\/script>');

    window.RAUCHTEST_HTML = html;
    var alt = doc();
    rahmen.src = '/tools/test/leer.html?t=' + Date.now() + (opt.hash || '');
    return warteAuf('App geladen', function () {
      var w = win();
      return doc() !== alt && w.RA && (lehrer ? w.RA.lehrer : w.RA.app);
    });
  }

  var lehrerText = null;
  var LEHRKRAFT = 'lehrkraft@example.com';
  function lehrerLaden(extra) {
    var d = grunddaten();
    d['fortschritt/' + CODE.toLowerCase()] = { erledigt: {}, stempel: {}, zeit: {}, eintraege: {}, geaendert: Date.now() - 2 * 86400000 };
    return appLaden(Object.assign({ seite: 'lehrer', daten: d, lehrer: [LEHRKRAFT], googleKonto: LEHRKRAFT }, extra || {}));
  }
  function googleKlick() {
    return warteAuf('Google-Knopf', function () { return q('#google'); }).then(function (k) { k.click(); });
  }
  function aufLehrerListe() {
    return warteAuf('Kinderliste', function () { return q('#freischalten'); });
  }

  function grunddaten() {
    var d = {};
    d['kinder/' + CODE.toLowerCase()] = { vorname: 'Mila', angelegt: Date.parse('2026-09-01T08:00:00') };
    return d;
  }
  // Grunddaten plus Demo-Fall (tools/test/demo-fall.js).
  // Die Merkfrage bekommt eine kurze Bedenkzeit, damit der Test nicht 15 s wartet.
  function mitDemo() {
    var d = grunddaten();
    var fall = JSON.parse(JSON.stringify(window.DEMO_FALL.fall));
    fall.stationen.forEach(function (s) { s.aufgaben.forEach(function (a) { if (a.typ === 'merken') a.bedenkzeit = 0.3; }); });
    d['faelle/demo'] = fall;
    d['loesungen/demo'] = JSON.parse(JSON.stringify(window.DEMO_FALL.loesung));
    return d;
  }
  function gelesen(praefix) {
    return (win().ATTRAPPE.gelesen || []).some(function (p) { return p.indexOf(praefix) === 0; });
  }
  function aufStart() {
    return warteAuf('Startseite', function () { return q('#nicht-ich'); });
  }
  function aufAnmeldung() {
    return warteAuf('Anmeldebildschirm', function () { return q('#anmeldung'); });
  }
  function codeEintippen(code) {
    q('#code').value = code;
    q('#anmeldung button[type="submit"]').click();
  }
  function fehlertext() {
    return warteAuf('Fehlermeldung', function () {
      var el = q('#code-fehler');
      return el && !el.hidden && el.textContent.trim();
    });
  }

  // ---------- Tests ----------
  fetch('/index.html?t=' + Date.now()).then(function (r) { return r.text(); })
    .then(function (t) { quelltext = t; })

    .then(function () { return test('index.html: noindex und Versionsnummern', function () {
      pruefe(/<meta name="robots" content="noindex, nofollow">/.test(quelltext), 'robots-noindex fehlt');
      var lokal = quelltext.match(/(?:src|href)="(?:js|css)\/[^"]+"/g) || [];
      var ohne = lokal.filter(function (s) { return !/\?v=\d+"$/.test(s); });
      pruefe(!ohne.length, 'ohne ?v=N: ' + ohne.join(', '));
      var v = {}; lokal.forEach(function (s) { v[s.match(/\?v=(\d+)/)[1]] = 1; });
      pruefe(Object.keys(v).length === 1, 'unterschiedliche Versionsnummern: ' + Object.keys(v).join(', '));
      return lokal.length + ' Dateien mit ?v=' + Object.keys(v)[0];
    }); })

    .then(function () { return test('Zusammenführen: Zeit addiert sich, Erledigtes bleibt', function () {
      return appLaden({ modus: 'offline' }).then(function () {
        var m = win().RA.mische.spielstand;
        var basis = { zeit: { a: 100 }, erledigt: {} };
        var lokal = { zeit: { a: 160 }, erledigt: { a: 50 }, eintraege: { x: { t: 'neu', ts: 9 } }, geaendert: 9 };
        var fern  = { zeit: { a: 130, b: 20 }, erledigt: { b: 40, a: 70 }, eintraege: { x: { t: 'alt', ts: 5 } }, geaendert: 7 };
        var z = m(basis, lokal, fern);
        pruefe(z.zeit.a === 190, 'Zeit a: ' + z.zeit.a + ' statt 190');
        pruefe(z.zeit.b === 20, 'Zeit b: ' + z.zeit.b + ' statt 20');
        pruefe(z.erledigt.a === 50 && z.erledigt.b === 40, 'Erledigt: ' + JSON.stringify(z.erledigt));
        pruefe(z.eintraege.x.t === 'neu', 'Eintrag: ' + JSON.stringify(z.eintraege));
        pruefe(z.geaendert === 9, 'geaendert: ' + z.geaendert);
        // Abzeichen: eigene Änderung gewinnt, sonst gilt die Datenbank
        pruefe(m({ abzeichen: 'qualle' }, { abzeichen: 'seestern' }, { abzeichen: 'qualle' }).abzeichen === 'seestern', 'Abzeichen lokal geändert');
        pruefe(m({ abzeichen: 'qualle' }, { abzeichen: 'qualle' }, { abzeichen: 'muschel' }).abzeichen === 'muschel', 'Abzeichen fern geändert');
        pruefe(m(null, {}, null).abzeichen === '', 'Abzeichen leer ist nicht leerer Text');
        var leer = m(null, {}, null);
        pruefe(leer && leer.zeit && !Object.keys(leer.zeit).length, 'leerer Stand kaputt');
      });
    }); })

    .then(function () { return test('Ohne Firebase: Hinweis statt Absturz', function () {
      return appLaden({ modus: 'offline' })
        .then(function () { return warteAuf('Offline-Hinweis', function () { return q('#neu-laden'); }); })
        .then(function () { barrierefrei('Offline'); });
    }); })

    .then(function () { return test('QR-Scan, erstes Mal: Konto wird angelegt, Startseite mit Vorname', function () {
      return appLaden({ daten: grunddaten(), hash: '#c=' + CODE })
        .then(aufStart)
        .then(function () {
          pruefe(/Hallo, Mila!/.test(text('h1')), 'h1 ist „' + text('h1') + '“');
          pruefe(win().ATTRAPPE.konten[MAIL] === CODE, 'Firebase-Konto wurde nicht angelegt');
          pruefe(!/c=/.test(win().location.href), 'Code steht noch in der Adresse');
          barrierefrei('Startseite');
        });
    }); })

    .then(function () { return test('Fortschritt wird in fortschritt/<code> abgeglichen', function () {
      return warteAuf('Schreibvorgang', function () { return win().ATTRAPPE.daten['fortschritt/' + CODE.toLowerCase()]; })
        .then(function (d) {
          pruefe(typeof d.geaendert === 'number', 'geaendert fehlt');
          var erlaubt = ['erledigt', 'stempel', 'zeit', 'eintraege', 'geaendert', 'abzeichen'];
          pruefe(d.abzeichen === undefined || typeof d.abzeichen === 'string', 'abzeichen ist kein Text');
          var fremd = Object.keys(d).filter(function (k) { return erlaubt.indexOf(k) < 0; });
          pruefe(!fremd.length, 'Felder, die die Regeln ablehnen würden: ' + fremd.join(', '));
          // Lernzeit dazuzählen und erneut speichern
          win().RA.store.zeitDazu('probe', 42);
          return win().RA.cloud.schreiben();
        })
        .then(function () {
          var d = win().ATTRAPPE.daten['fortschritt/' + CODE.toLowerCase()];
          pruefe(d.zeit && d.zeit.probe === 42, 'Lernzeit nicht gespeichert: ' + JSON.stringify(d.zeit));
        });
    }); })

    .then(function () { return test('Detektivbuch: erreichbar, ein h1, kein Zugangscode sichtbar', function () {
      q('a.fenster--buch').click();
      return warteAuf('Detektivbuch', function () { return /Mein Detektivbuch/.test(text('h1')) && q('#abzeichen-waehlen'); })
        .then(function () {
          barrierefrei('Detektivbuch');
          var t = doc().body.textContent;
          pruefe(/Mila/.test(text('.ausweis__name')), 'Vorname fehlt auf dem Ausweis');
          pruefe(!/TEST-?2345/i.test(t), 'Zugangscode steht auf der Seite');
          pruefe(qa('main h2').length === 3, qa('main h2').length + ' statt 3 h2 (Ausweis, Stempel, Lernzeit)');
        });
    }); })

    .then(function () { return test('Abzeichen: echter Dialog, Wahl wird gespeichert, Fokus zurück', function () {
      var knopf = q('#abzeichen-waehlen');
      knopf.click();
      var d = q('#abzeichen-dialog');
      pruefe(d.open, 'Dialog nicht offen');
      pruefe(d.contains(doc().activeElement), 'Fokus nicht im Dialog');
      pruefe(qa('.wahl__knopf').length === 6, qa('.wahl__knopf').length + ' statt 6 Abzeichen');
      q('.wahl__knopf[data-id="seestern"]').click();
      return warteAuf('Dialog zu, Fokus zurück', function () { return !d.open && doc().activeElement === knopf; })
        .then(function () {
          pruefe(win().RA.store.snapshot().abzeichen === 'seestern', 'Abzeichen nicht im Speicher');
          pruefe(/Seestern/.test(q('.ausweis__abzeichen').getAttribute('alt') || ''), 'Ausweis zeigt das Abzeichen nicht');
          return win().RA.cloud.schreiben();
        })
        .then(function () {
          var f = win().ATTRAPPE.daten['fortschritt/' + CODE.toLowerCase()];
          pruefe(f.abzeichen === 'seestern', 'In der Datenbank: ' + f.abzeichen);
        });
    }); })

    .then(function () { return test('Stempel und Lernzeit erscheinen mit Testdaten', function () {
      var w = win();
      var s = w.RA.store.snapshot();
      s.stempel = { pausenbrot: Date.parse('2026-10-02T10:00:00'), schluessel: Date.parse('2026-10-20T10:00:00') };
      s.zeit = { pausenbrot: 1260, schluessel: 2950 };
      w.RA.store.abgleichUebernehmen(s);
      w.RA.buch.zeigen();
      pruefe(qa('.stempel__marke').length === 2, qa('.stempel__marke').length + ' statt 2 Stempel');
      pruefe(/2\.10\.2026/.test(q('.stempel__marke').getAttribute('aria-label')), 'Stempel ohne Datum');
      pruefe(/1 Stunde 10 Minuten/.test(text('.lernzeit__gesamt')), 'Gesamt: ' + text('.lernzeit__gesamt'));
      pruefe(qa('.lernzeit__liste li').length === 2, 'Lernzeit je Akte fehlt');
      barrierefrei('Detektivbuch mit Stempeln');
    }); })

    .then(function () { return test('Lernzeit-Uhr: Deckel 30 Minuten, Pause bei verdeckter Seite', function () {
      var w = win(), echt = w.Date.now, jetzt = 1e12;
      w.Date.now = function () { return jetzt; };
      function verdeckt(ja) {
        Object.defineProperty(doc(), 'hidden', { configurable: true, get: function () { return ja; } });
        doc().dispatchEvent(new w.Event('visibilitychange'));
      }
      try {
        var vorher = w.RA.store.snapshot().zeit.uhrtest || 0;
        w.RA.uhr.start('uhrtest'); jetzt += 4000 * 1000; w.RA.uhr.stopp();
        var a = w.RA.store.snapshot().zeit.uhrtest - vorher;
        pruefe(a === w.RA.config.lernzeitMaxStueck, 'Deckel: ' + a + ' statt ' + w.RA.config.lernzeitMaxStueck);
        w.RA.uhr.start('uhrtest'); jetzt += 90 * 1000;
        verdeckt(true);
        jetzt += 500 * 1000;
        verdeckt(false);
        jetzt += 10 * 1000; w.RA.uhr.stopp();
        var b = w.RA.store.snapshot().zeit.uhrtest - vorher - a;
        pruefe(b === 100, 'mit Pause: ' + b + ' statt 100 Sekunden');
        pruefe(!w.RA.uhr.laeuft(), 'Uhr läuft nach stopp weiter');
      } finally {
        w.Date.now = echt;
        delete doc().hidden;
      }
    }); })

    .then(function () { return test('Ausweis als PDF: A4-Seite, gültige PDF-Datei', function () {
      var w = win(), blob;
      return w.RA.buch._ausweisSeite(w.RA.cloud.kind(), w.RA.store.snapshot()).then(function (c) {
        pruefe(c.width === 1240 && c.height === 1754, 'Canvas ' + c.width + 'x' + c.height);
        blob = w.RA.buch._pdfAusSeiten([c]);
        pruefe(blob.size > 20000, 'PDF nur ' + blob.size + ' Byte');
        return blob.slice(0, 8).text();
      }).then(function (kopf) {
        pruefe(/^%PDF-1\.4/.test(kopf), 'Kein PDF-Kopf: ' + kopf);
        q('#ausweis-pdf').click();
        return warteAuf('PDF-Link', function () { var z = q('#pdf-zeile'); return z && !z.hidden && q('#pdf-link').href; });
      }).then(function () {
        pruefe(/^blob:/.test(q('#pdf-link').href), 'Link ist kein blob');
        pruefe(/Detektivausweis-Mila\.pdf/.test(q('#pdf-link').download), 'Dateiname: ' + q('#pdf-link').download);
        return Math.round(blob.size / 1024) + ' KB';
      });
    }); })

    .then(function () { return test('Detektivbuch: Zurück führt zur Startseite', function () {
      q('a.zurueck').click();
      return aufStart().then(function () { pruefe(/Hallo, Mila!/.test(text('h1')), 'h1 ist „' + text('h1') + '“'); });
    }); })

    // ---------- Akten (Etappe 3), mit dem Demo-Fall ----------
    .then(function () { return test('Akte erscheint auf der Startseite, Lösung wird noch nicht geladen', function () {
      return appLaden({ daten: mitDemo(), hash: '#c=' + CODE })
        .then(aufStart)
        .then(function () { return warteAuf('Akte in der Liste', function () { return q('a.fenster--akte'); }); })
        .then(function (a) {
          pruefe(/Die verschwundene Muschel/.test(a.textContent), 'Titel fehlt: ' + a.textContent);
          pruefe(a.getAttribute('href') === '#akte/demo', 'Link: ' + a.getAttribute('href'));
          pruefe(!gelesen('loesungen/'), 'Lösung schon auf der Startseite geladen');
          barrierefrei('Startseite mit Akte');
        });
    }); })

    .then(function () { return test('Akte öffnen: Station 1, Uhr läuft, Weiter erst nach dem Prüfen', function () {
      q('a.fenster--akte').click();
      return warteAuf('Station 1', function () { return /Station 1/.test(text('h2')) && q('[data-pruefen]'); })
        .then(function () {
          pruefe(/Die verschwundene Muschel/.test(text('h1')), 'h1: ' + text('h1'));
          pruefe(win().RA.uhr.laeuft() === 'demo', 'Uhr läuft nicht für die Akte');
          pruefe(q('#weiter').disabled, 'Weiter ist schon vor dem Prüfen frei');
          pruefe(q('[data-pruefen]').disabled, 'Prüfen ohne Auswahl möglich');
          pruefe(q('[aria-current="step"]'), 'Stationsleiste ohne aria-current');
          var bild = q('.akte__bild img');
          pruefe(bild && bild.getAttribute('alt'), 'Bild in der Geschichte fehlt oder hat keinen Alt-Text');
          barrierefrei('Akte Station 1');
          pruefe(!gelesen('loesungen/'), 'Lösung vor dem Prüfen geladen');
          q('.option[data-wert="B"]').click();
          q('[data-pruefen]').click();
          return warteAuf('Rückmeldung', function () { var r = q('.rueckmeldung'); return r && !r.hidden && r; });
        })
        .then(function (r) {
          pruefe(gelesen('loesungen/demo'), 'Lösung wurde nicht aus loesungen/demo geladen');
          pruefe(/Nicht ganz/.test(r.textContent) && /Detektivfrage/.test(r.textContent), 'Rückmeldung: ' + r.textContent);
          pruefe(doc().activeElement === r, 'Fokus nicht auf der Rückmeldung');
          pruefe(/richtig/.test(q('.option[data-wert="A"]').textContent), 'richtige Antwort nicht als Text markiert');
          pruefe(/nicht richtig/.test(q('.option[data-wert="B"]').textContent), 'falsche Wahl nicht als Text markiert');
          pruefe(!q('#weiter').disabled, 'Weiter nach dem Prüfen gesperrt');
        });
    }); })

    .then(function () { return test('Stationen: Springen nur bis zur erreichten Station', function () {
      q('#weiter').click();
      return warteAuf('Station 2', function () { return /Station 2/.test(text('h2')); })
        .then(function () {
          pruefe(win().RA.store.snapshot().eintraege.demo.station === 1, 'Station nicht gespeichert');
          var alt = q('h2');
          win().location.hash = 'akte/demo/5';
          // auf die neu gezeichnete Station warten, nicht auf die alte
          return warteAuf('wieder Station 2', function () { return q('h2') !== alt && /Station 2/.test(text('h2')); });
        })
        .then(function () {
          pruefe(qa('.stationen__punkt.ist-zu').length === 4, qa('.stationen__punkt.ist-zu').length + ' statt 4 gesperrte Stationen');
        });
    }); })
